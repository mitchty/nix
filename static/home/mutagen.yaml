sync:
  defaults:
    ignore:
      paths:
        - ".zfs"
        - ".#*"
        - "*.desktop"
        - "result"
        - ".directory"
        - "*.swp"
        - ".terraform"
        - ".venv"
        - "tmp"
        - "cache"
        - "**/.git/git-agecrypt"
        - ".Trashes"
        - ".fseventsd"
        - ".DS_Store"
        - ".Spotlight-V100"
        - ".TemporaryItems"
        - ".DocumentRevisions-V100"
        - "**/.pre-commit-config.yaml"
        - "target/debug"
        - "target/release"
      vcs: false # I'm normally syncing git dirs too and only really doing work on one host so I *DO* want to sync .git dirs
