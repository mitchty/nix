sync:
  defaults:
    ignore:
      paths:
        - ".stversions"
        - ".zfs"
        - ".direnv"
        - ".#*"
        - "*.desktop"
        - "result"
        - "*.sync-conflict-*"
        - ".DS_Store"
        - ".directory"
        - "*.swp"
        - ".terraform"
        - ".venv"
        - "tmp"
        - "cache"
        - "src/**/target"
        - "src/tmp/uniq"
        - ".Trashes"
        - ".fseventsd"
        - ".Spotlight-V100"
      vcs: false # I'm normally syncing git dirs too and only really doing work on one host so I *DO* want to sync .git dirs
